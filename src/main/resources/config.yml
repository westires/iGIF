debug: false

processing:
  async: true
  cleanup-old-frames: true

limits:
  max-width: 256
  max-height: 256
  max-frames: 500

cache:
  enabled: true

console:
  colored-output: true

resourcepack:
  # Hangi sistem resource pack sağlasın: itemsadder | standalone
  # itemsadder: ItemsAdder eklentisi font/texture yönetimini üstlenir (varsayılan)
  # standalone: iGIF kendi HTTP sunucusuyla pack üretir ve gönderir
  provider: itemsadder
  serve: true
  port: 8765
  host: ""

web:
  enabled: true
  port: 8766

itemsadder:
  namespace: igif
  auto-reload: true