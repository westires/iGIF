# iGIF Configuration
# Author: Westires

debug: false

processing:
  # Run GIF processing on async threads (recommended: true)
  async: true
  # Remove old generated frames when regenerating
  cleanup-old-frames: true

limits:
  max-width: 256
  max-height: 256
  max-frames: 500

cache:
  # Cache animation metadata in memory after first load
  enabled: true

console:
  # Use ANSI colors in console output (disable if your console doesn't support them)
  colored-output: true

itemsadder:
  # Namespace used for all iGIF font images in ItemsAdder
  namespace: igif
  # Automatically trigger /iazip and /iareload after generating an animation
  auto-reload: true