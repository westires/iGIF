# iGIF Messages
# MiniMessage format: https://docs.advntr.dev/minimessage/format.html

prefix: "<bold><gradient:#55ff55:#aaffaa>iGIF</gradient></bold> <dark_gray>»</dark_gray> "

# --- Animations ---
animation-generated: "<green>Animation <white><animation></white> successfully generated <gray>(<frames> frames, <fps> fps)</gray><green>."
animation-already-exists: "<yellow>Animation <white><animation></white> already exists. Use <white>/igif regenerate <animation></white> to replace it."
animation-not-found: "<red>Animation <white><animation></white> was not found. Use <white>/igif list</white> to see available animations."
animation-not-generated: "<red>Animation <white><animation></white> exists but has not been generated yet. Run <white>/igif generate <animation></white> first."
animation-playing: "<green>Playing <white><animation></white> for <white><player></white> via <white><type></white>."
animation-stopped: "<yellow>Stopped animation <white><animation></white> for <white><player></white>."
animation-stopped-all: "<yellow>Stopped all animations for <white><player></white>."
animation-created: "<green>Animation folder created for <white><animation></white>. Place your GIF inside and configure <white>config.yml</white>."

# --- Processing ---
processing-start: "<yellow>Processing animation <white><animation></white><yellow>..."
processing-already-running: "<yellow>Animation <white><animation></white> is already being processed."

# --- Errors ---
no-permission: "<red>You don't have permission to do that."
