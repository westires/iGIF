invalid-display-type: "<red>Invalid display type <white><type></white>. Use: <white>title</white>, <white>subtitle</white>, or <white>actionbar</white>."
gif-not-found: "<red>GIF file not found for animation <white><animation></white>. Place <white>animation.gif</white> in its folder."
invalid-config: "<red>Configuration error for animation <white><animation></white>: <white><error></white>"

