name: iGIF
version: '${project.version}'
main: com.westires.igif.IGIFPlugin
api-version: '1.21'
description: Animated GIF to Minecraft Title/Subtitle/ActionBar via ItemsAdder
author: Westires
website: https://github.com/Westires/iGIF

depend:
  - ItemsAdder

softdepend:
  - Skript

commands:
  igif:
    description: Main iGIF command
    usage: /igif <subcommand>
    permission: igif.use
    aliases:
      - gif

permissions:
  igif.use:
    description: Allows using basic iGIF commands
    default: op

  igif.admin:
    description: Full iGIF admin access
    default: op
    children:
      igif.create: true
      igif.generate: true
      igif.play: true
      igif.stop: true
      igif.reload: true
      igif.list: true
      igif.info: true
      igif.config: true

  igif.create:
    description: Create animation configs
    default: op

  igif.generate:
    description: Generate/process animations
    default: op

  igif.play:
    description: Play animations for players
    default: op

  igif.stop:
    description: Stop animations
    default: op

  igif.reload:
    description: Reload iGIF configuration
    default: op

  igif.list:
    description: List all animations
    default: op

  igif.info:
    description: View animation info
    default: op

  igif.config:
    description: Edit animation config values in-game
    default: op